services:
  app:
    build: .
    environment:
      POSTGRES_CONNECTION: ${POSTGRES_CONNECTION}
      SQLITE_CONNECTION: ${SQLITE_CONNECTION}
      MONGO_CONNECTION: ${MONGO_CONNECTION}
      MONGO_DB: ${MONGO_DB}
      REDIS_CONNECTION: redismaster:6379,redisreplica:6379,password=${REDIS_PASSWORD},abortConnect=False,connectTimeout=1000,socketTimeout=1000
    volumes:
      - ./data:/app/data
    ports:
      - "8080:8080"
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  postgresql:
    image: postgres:bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  mongodb:
    image: mongo:6.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongodata:/data/db
      - mongoconfig:/data/configdb
      - ./check-mongo.sh:/usr/local/bin/check-mongo.sh:ro
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "/usr/local/bin/check-mongo.sh"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    restart: unless-stopped

  redismaster:
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - redismasterdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redisreplica:
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --replicaof redismaster 6379 --masterauth \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - redisreplicadata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  mongodata:
  mongoconfig:
  redismasterdata:
  redisreplicadata: